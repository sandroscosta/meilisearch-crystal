name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: "*"

jobs:
  specs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        crystal_version: [1.20.3, latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    env:
      # The spec helper defaults to these in test/integration specs.
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: test-master-key
      MEILISEARCH_INTEGRATION: "1"
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.53.0
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal_version }}
      - name: Install shards
        run: shards install
      - name: Run tests
        run: crystal spec
      - name: Check format
        run: crystal tool format --check
      - name: Lint
        # ameba v1.7.0-dev doesn't ship a pre-built binary, so we compile and run
        # the CLI source in one step. This also works on newer Crystal versions
        # where the previous 1.6.x stable release failed to build.
        run: crystal run lib/ameba/bin/ameba.cr
